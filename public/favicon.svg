<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(215, 80%, 40%); stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(215, 30%, 10%); stop-opacity:1" />
    </linearGradient>

    <!-- Soft white glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded gradient background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)" />

  <!-- Playfair Display "GK" -->
  <text x="50" y="68"
        font-family="'Playfair Display', serif"
        font-size="48"
        font-weight="600"
        fill="hsl(0, 0%, 98%)"
        text-anchor="middle"
        filter="url(#glow)">
    GK
  </text>
</svg>
